# Student Hub API. The site itself is on Vercel and proxies /api/* here. TLS block added by certbot.
server {
    listen 80;
    server_name __HOST__;
    client_max_body_size 1m;

    # Quiz live games: browsers connect here directly (Vercel rewrites do not proxy WebSockets).
    location = /api/quiz/live/ws {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    # Quiz from lecture notes: up to 5 files × 10 MB, AI calls take a while.
    location ^~ /api/quiz/generate/ {
        client_max_body_size 52m;
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location / { return 404; }
}
