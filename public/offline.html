<!doctype html>
<html lang="kk" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F8FE">
<title>Student Hub — интернет жоқ</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<!-- Shown by public/sw.js when a page that was never opened before is requested without internet (docs/PWA.md).
     Self-contained: no build files, no fonts from the network. -->
<style>
  :root { color-scheme: light; --bg: #F5F8FE; --surface: #FFFFFF; --line: #E3E8F3; --text: #141A33; --muted: #646C8A; --primary: #2F57E8; --on-primary: #FFFFFF; }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #0E1324; --surface: #161C31; --line: #283152; --text: #E9ECF8; --muted: #A3AAC6; --primary: #8EA6FF; --on-primary: #0E1324; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.5 "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 40px) 16px 32px; display: flex; flex-direction: column; gap: 16px; }
  .ico { width: 56px; height: 56px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
  h1 { margin: 0; font-size: 1.35rem; line-height: 1.25; }
  p { margin: 0; color: var(--muted); }
  .btn { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 10px 16px; border-radius: 14px; border: 1px solid var(--primary); background: var(--primary); color: var(--on-primary); font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
  .group { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .group a { display: block; padding: 14px 16px; color: var(--text); text-decoration: none; font-weight: 500; }
  .group a + a { border-top: 1px solid var(--line); }
  .small { font-size: .85rem; }
</style>
<script>
  try { var s = JSON.parse(localStorage.getItem('studenthub.v1') || 'null'); if (s && s.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); if (s && s.lang === 'ru') document.documentElement.lang = 'ru'; } catch (e) {}
</script>
</head>
<body>
<main>
  <div class="ico" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20M8.5 16.4a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 5.2-2.7M19 12.9a10 10 0 0 0-2.3-1.6M1.4 9a15 15 0 0 1 4.4-2.7M10.7 5.1A15 15 0 0 1 22.6 9M12 20h.01"/></svg>
  </div>
  <h1 data-kk="Интернет жоқ" data-ru="Нет интернета">Интернет жоқ</h1>
  <p data-kk="Бұл бет әлі сақталмаған, сондықтан интернетсіз ашылмайды. Сақталған бөлімдер төменде." data-ru="Эта страница ещё не сохранена и без интернета не откроется. Сохранённые разделы — ниже.">Бұл бет әлі сақталмаған, сондықтан интернетсіз ашылмайды. Сақталған бөлімдер төменде.</p>
  <button class="btn" type="button" id="retry" data-kk="Қайталау" data-ru="Повторить">Қайталау</button>
  <nav class="group" aria-label="Student Hub">
    <a href="/" data-kk="Басты бет және сабақ кестесі" data-ru="Главная и расписание">Басты бет және сабақ кестесі</a>
    <a href="/map" data-kk="Кампус картасы" data-ru="Карта кампуса">Кампус картасы</a>
    <a href="/mine" data-kk="Менің тізімім және билеттер" data-ru="Мой список и билеты">Менің тізімім және билеттер</a>
    <a href="/profile" data-kk="Профиль және студенттік QR" data-ru="Профиль и студенческий QR">Профиль және студенттік QR</a>
  </nav>
  <p class="small" data-kk="Интернет қосылғанда бет өзі ашылады." data-ru="Когда появится интернет, страница откроется сама.">Интернет қосылғанда бет өзі ашылады.</p>
</main>
<script>
  (function () {
    var ru = document.documentElement.lang === 'ru';
    if (ru) {
      document.title = 'Student Hub — нет интернета';
      var els = document.querySelectorAll('[data-ru]');
      for (var i = 0; i < els.length; i++) els[i].textContent = els[i].getAttribute('data-ru');
    }
    document.getElementById('retry').addEventListener('click', function () { location.reload(); });
    window.addEventListener('online', function () { location.reload(); });
  })();
</script>
</body>
</html>
