# Student Hub — Docker Swarm stack. OPTIONAL variant, not the default.
#
# The shared VPS runs docker/docker-compose.yml (Swarm inactive) behind its host nginx. This stack is for a server
# where Student Hub owns ports 80/443: it brings its own nginx container (docker/nginx.conf, certificates from the
# host's /etc/letsencrypt).
#
#   ssh root@<server> 'bash -s' < docker/swarm-init.sh     # once: swarm init + the Postgres password secret
#   bash docker/swarm-deploy.sh                            # from the laptop: build, ship, docker stack deploy
#   docker stack services studenthub; docker service logs studenthub_api
#
# Variables (API_TAG, WEB_TAG, POSTGRES_PASSWORD) come from /opt/studenthub/docker/.env, exported by vps-apply.sh;
# the application settings from /opt/studenthub/.env.

version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_buffers=24MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_USER: studenthub
      POSTGRES_DB: studenthub
      POSTGRES_PASSWORD_FILE: /run/secrets/studenthub_postgres_password
    secrets:
      - studenthub_postgres_password
    volumes:
      - studenthub-pg:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 160M
      restart_policy:
        condition: on-failure
        delay: 5s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studenthub -d studenthub -q"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    image: studenthub-api:${API_TAG:-latest}
    env_file:
      - /opt/studenthub/.env
    environment:
      API_ADDR: ":8110"
      DATABASE_URL: postgres://studenthub:${POSTGRES_PASSWORD}@postgres:5432/studenthub?sslmode=disable
      UPLOAD_DIR: /app/uploads
      CONTENT_URL: http://127.0.0.1:8110
      GOMEMLIMIT: 120MiB
      TZ: Asia/Almaty
    volumes:
      - /opt/studenthub/uploads:/app/uploads
    # host timers (docker/systemd) curl the API on 127.0.0.1:8110
    ports:
      - target: 8110
        published: 8110
        mode: host
    networks:
      - internal
    deploy:
      # one replica: uploads live on this host's disk and live quiz rooms are kept in memory
      replicas: 1
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
      resources:
        limits:
          memory: 150M
      restart_policy:
        condition: on-failure
        delay: 5s

  web:
    image: studenthub-web:${WEB_TAG:-latest}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "8112"
      API_ORIGIN: http://api:8110
      NODE_OPTIONS: --max-old-space-size=192
    networks:
      - internal
    deploy:
      replicas: 1
      update_config:
        order: start-first
      resources:
        limits:
          memory: 300M
      restart_policy:
        condition: on-failure
        delay: 5s

  nginx:
    image: nginx:1.27-alpine
    # host mode: the real client IP reaches nginx (the API rate-limits per IP)
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 64M
      restart_policy:
        condition: on-failure

networks:
  internal:
    driver: overlay

volumes:
  studenthub-pg:
    external: true
    name: studenthub-pg

secrets:
  studenthub_postgres_password:
    external: true

configs:
  nginx_conf:
    # a new name per content change, so `docker stack deploy` rotates the config
    name: studenthub_nginx_conf_${NGINX_CONFIG_VERSION:-v1}
    file: ./nginx.conf
