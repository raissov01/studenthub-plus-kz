# Student Hub — nginx CONTAINER with TLS, for a server where Student Hub owns ports 80/443 (the Swarm variant,
# docker/stack.yml, or a dedicated box). NOT used on the shared VPS: there the host nginx serves several sites and
# reads docker/nginx.host.conf instead. Certificates are mounted from the host's /etc/letsencrypt.

server {
    listen 80;
    server_name studenthub.studywithraissov.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# plain HTTP for health probes from inside the overlay network (docker exec ... wget http://nginx/healthz)
server {
    listen 80 default_server;
    server_name _;
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location / {
        return 444;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name studenthub.studywithraissov.com;

    ssl_certificate     /etc/letsencrypt/live/studenthub.studywithraissov.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studenthub.studywithraissov.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    location = /api/quiz/live/ws {
        proxy_pass http://api:8110;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /api/portfolio/certificates {
        client_max_body_size 11m;  # certificate files: PDF ≤ 10 MB (+ form fields)
        proxy_pass http://api:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /api/quiz/generate/ {
        client_max_body_size 52m;
        proxy_pass http://api:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass http://api:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass http://web:8112;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        proxy_pass http://web:8112;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
