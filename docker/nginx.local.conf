# Student Hub — nginx CONTAINER for a local full-stack run (docker-compose.local.yml + docker-compose.override.yml).
# One origin like production, plain HTTP on :8088 of the laptop. Same routing as nginx.host.conf.
server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    location = /api/quiz/live/ws {
        proxy_pass http://api:8110;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location = /api/portfolio/certificates {
        client_max_body_size 11m;  # certificate files: PDF ≤ 10 MB (+ form fields)
        proxy_pass http://api:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location = /api/print/uploads {
        client_max_body_size 21m;  # print shop uploads: one file ≤ 20 MB (docs/print.md)
        proxy_pass http://api:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location ^~ /api/quiz/generate/ {
        client_max_body_size 52m;
        proxy_pass http://api:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass http://api:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://web:8112;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
