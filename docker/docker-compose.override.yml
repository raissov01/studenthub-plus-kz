# Local full stack behind one origin, like production: an nginx container (docker/nginx.local.conf) on :8088 sends
# /api/* (and the quiz WebSocket) to the API and everything else to the web server.
#
#   docker compose -f docker/docker-compose.local.yml -f docker/docker-compose.override.yml up -d --build
#   open http://localhost:8088
#
# Never used on the VPS: there the host nginx (docker/nginx.host.conf) plays this role and
# docker/docker-compose.yml is always given explicitly with -f.

services:
  web:
    build:
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:8088

  api:
    environment:
      SITE_URL: http://localhost:8088

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m
