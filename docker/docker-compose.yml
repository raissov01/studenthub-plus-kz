# Student Hub — production on the shared VPS (85.137.91.47), Docker Compose.
#
# Lives on the server as /opt/studenthub/docker/docker-compose.yml (copied by docker/smart-deploy.sh).
# Nothing is built on the server: the images are built on a laptop or CI and arrive with `docker load`.
# The HOST nginx (docker/nginx.host.conf) terminates TLS and routes:
#   /api/*  -> api  127.0.0.1:8110      everything else -> web 127.0.0.1:8112
#
#   cd /opt/studenthub/docker
#   docker compose up -d                       # start / apply
#   docker compose run --rm api /app/migrate   # migrations (smart-deploy runs them when needed)
#   docker compose ps; docker compose logs -f api
#
# Variables come from ./.env next to this file (written by docker/vps-apply.sh, never committed):
#   API_TAG, WEB_TAG          image tags currently deployed (git sha)
#   POSTGRES_PASSWORD         taken from DATABASE_URL in /opt/studenthub/.env
#   STUDENTHUB_UID/GID        owner of /opt/studenthub/uploads (the old systemd user), so uploads stay writable
#   KASPI_TAG                 kaspi-pos image tag (café Kaspi Pay sidecar), only with COMPOSE_PROFILES=cafe-kaspi
#   COMPOSE_PROFILES          cafe-kaspi starts the kaspi-pos sidecar (docs/cafe.md); unset = it never starts
# The application settings stay in /opt/studenthub/.env (the same file the systemd units used); the sidecar's
# own secrets live in /opt/studenthub/kaspi-pos.env (docker/.env.example).

name: studenthub

services:
  postgres:
    # SAME container name, image major version and volume as the container created by the old deploy/deploy-vps.sh:
    # the data in the existing volume `studenthub-pg` is reused as is, and `docker exec studenthub-postgres ...`
    # (backups) keeps working.
    image: postgres:16-alpine
    container_name: studenthub-postgres
    command: ["postgres", "-c", "shared_buffers=24MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_USER: studenthub
      POSTGRES_DB: studenthub
      # only used when the volume is empty (first init); an existing cluster keeps its own password
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - studenthub-pg:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 160m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studenthub -d studenthub -q"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    image: studenthub-api:${API_TAG:-latest}
    container_name: studenthub-api
    env_file:
      - ${STUDENTHUB_ENV_FILE:-/opt/studenthub/.env}
    environment:
      # these win over the env file: inside compose the API listens on all interfaces of its container and reaches
      # Postgres by service name
      API_ADDR: ":8110"
      DATABASE_URL: postgres://studenthub:${POSTGRES_PASSWORD}@postgres:5432/studenthub?sslmode=disable
      UPLOAD_DIR: /app/uploads
      # the bot reads the feed from the API itself, not through the public host
      CONTENT_URL: http://127.0.0.1:8110
      GOMEMLIMIT: 120MiB
      TZ: Asia/Almaty
    user: "${STUDENTHUB_UID:-10001}:${STUDENTHUB_GID:-10001}"
    ports:
      - "127.0.0.1:8110:8110"
    volumes:
      # market photos and quiz media (the API is the only writer)
      - ${STUDENTHUB_UPLOADS:-/opt/studenthub/uploads}:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 150m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8110/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    image: studenthub-web:${WEB_TAG:-latest}
    container_name: studenthub-web
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "8112"
      # server components (job/opportunity/event metadata, /p/<slug>) call the API over the compose network
      API_ORIGIN: http://api:8110
      NODE_OPTIONS: --max-old-space-size=192
    ports:
      - "127.0.0.1:8112:8112"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 300m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8112/manifest.webmanifest').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  kaspi-pos:
    # Café Kaspi Pay sidecar (services/kaspi-pos, docs/cafe.md): issues QR in the café's OWN name with the
    # cashier session the café granted us; Student Hub never holds money. Starts only with the profile
    # (COMPOSE_PROFILES=cafe-kaspi in ./.env). No published port: only the api reaches it, as
    # http://kaspi-pos:3000 on this project's network; it needs outbound https to Kaspi.
    profiles: ["cafe-kaspi"]
    image: studenthub-kaspi-pos:${KASPI_TAG:-latest}
    container_name: studenthub-kaspi-pos
    env_file:
      # INTERNAL_API_KEY (= CAFE_KASPI_API_KEY of the api), TOKEN_SECRET_KEY, WEBHOOK_SECRET (= CAFE_KASPI_WEBHOOK_SECRET)
      - ${KASPI_POS_ENV_FILE:-/opt/studenthub/kaspi-pos.env}
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /data
      ENABLE_DEMO_UI: "false"
      WEBHOOK_URL: http://api:8110/api/cafe/kaspi/webhook
      WEBHOOK_ALLOWED_HTTP_HOSTS: api
      NODE_OPTIONS: --max-old-space-size=96
      TZ: Asia/Almaty
    expose:
      - "3000"
    volumes:
      # device identity, keypair, tracked payments (0700); losing it means the cashier logs in again
      - kaspi-pos-data:/data
    restart: unless-stopped
    mem_limit: 150m

volumes:
  kaspi-pos-data:
    name: studenthub-kaspi-pos-data
  studenthub-pg:
    # created by the old `docker run ... -v studenthub-pg:...`; compose must never create or remove it
    external: true
    name: studenthub-pg
