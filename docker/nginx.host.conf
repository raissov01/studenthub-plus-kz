# Student Hub — HOST nginx on the shared VPS (85.137.91.47). Not a container: this nginx already serves the other
# sites on the server. Installed as /etc/nginx/conf.d/studenthub.conf by docker/vps-apply.sh (nginx -t, previous
# file restored on failure). It replaces the old API-only file that deploy/deploy-vps.sh + certbot wrote.
#
#   studenthub.studywithraissov.com            the site: /api/* -> api (Go, 127.0.0.1:8110), the rest -> web (Next, 127.0.0.1:8112)
#   studenthub.85-137-91-47.sslip.io           the OLD API host, API only, as before: the Vercel site, the Telegram
#                                              webhook and old links may still call it during the switch
#
# TLS: certbot certificates. The first time, issue the new host's certificate BEFORE installing this file
# (nginx refuses to start with a missing certificate, and every site on this server would go down with it):
#   certbot certonly --nginx -d studenthub.studywithraissov.com
# docs/deployment/vps.md has the full switch-over.

upstream studenthub_api {
    server 127.0.0.1:8110;
    keepalive 16;
}

upstream studenthub_web {
    server 127.0.0.1:8112;
    keepalive 16;
}

# ---------- studenthub.studywithraissov.com ----------

server {
    listen 80;
    server_name studenthub.studywithraissov.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name studenthub.studywithraissov.com;

    ssl_certificate     /etc/letsencrypt/live/studenthub.studywithraissov.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studenthub.studywithraissov.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    # Quiz live games: WebSocket on the same origin (wss://studenthub.studywithraissov.com/api/quiz/live/ws)
    location = /api/quiz/live/ws {
        proxy_pass http://studenthub_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Quiz from lecture notes: up to 5 files x 10 MB, AI calls take a while
    location ^~ /api/quiz/generate/ {
        client_max_body_size 52m;
        proxy_pass http://studenthub_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # The Go API, straight from nginx (no hop through Next): JSON, Telegram webhook, cron, market/quiz media
    location /api/ {
        proxy_pass http://studenthub_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Fingerprinted build files: never change under the same name
    location /_next/static/ {
        proxy_pass http://studenthub_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # The service worker must never be cached (Next sends no-store for it; keep nginx out of the way)
    location = /sw.js {
        proxy_pass http://studenthub_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # Pages (prerendered tabs, server-rendered job/opportunity/event and /p/<slug>) and public files
    location / {
        proxy_pass http://studenthub_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ---------- studenthub.85-137-91-47.sslip.io (old API host, kept during the switch) ----------

server {
    listen 80;
    server_name studenthub.85-137-91-47.sslip.io;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name studenthub.85-137-91-47.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/studenthub.85-137-91-47.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studenthub.85-137-91-47.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    location = /api/quiz/live/ws {
        proxy_pass http://studenthub_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location ^~ /api/quiz/generate/ {
        client_max_body_size 52m;
        proxy_pass http://studenthub_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
    location /api/ {
        proxy_pass http://studenthub_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # the site moved: old page links on this host go to the new one
    location / {
        return 301 https://studenthub.studywithraissov.com$request_uri;
    }
}
