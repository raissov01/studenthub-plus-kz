name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go vet + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: studenthub
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      # each package creates and drops its own throwaway database on this server (internal/testdb)
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:dev@localhost:54329/studenthub

  frontend:
    name: tsc, eslint, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # next build writes the PageProps/LayoutProps types tsc needs
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run test:ts
      - run: npm run build
        env:
          BUILD_ID: ${{ github.sha }}
      - name: Tabs must stay static
        run: |
          node -e '
            const m = require("./.next/prerender-manifest.json").routes;
            const bad = ["/", "/search", "/calendar", "/profile"].filter(r => !m[r] || m[r].initialRevalidateSeconds !== false);
            if (bad.length) { console.error("not prerendered:", bad.join(" ")); process.exit(1); }
            console.log("static:", Object.keys(m).length, "routes");'

  e2e:
    name: Playwright e2e (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          BUILD_ID: ${{ github.sha }}
      # the mocked suite (e2e/server.ts stands in for the Go API); the screenshot specs skip unless asked
      - run: npx playwright test --shard=${{ matrix.shard }}/4 --workers=2
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report
          retention-days: 7
